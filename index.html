<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joober pro firmy · video ukázka</title>
<meta name="description" content="Podívejte se za 30 sekund, jak Joober vyhodnotí a seřadí uchazeče na vaše inzeráty.">
<meta property="og:title" content="Joober pro firmy · video ukázka">
<meta property="og:description" content="Za 30 sekund: jak Joober vyhodnotí a seřadí uchazeče na vaše inzeráty.">
<meta property="og:image" content="poster-16x9.jpg">
<link rel="icon" href="favicon.png">
<style>
  :root{--purple:#7E00D8;--deep:#5A0099;--amber:#FFA84B;--ink:#0F0F16}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
    background:radial-gradient(120% 90% at 50% 0%,#9B2CF0 0%,var(--purple) 45%,var(--deep) 100%);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 16px 36px}
  header{width:100%;max-width:1120px;display:flex;align-items:center;justify-content:space-between}
  header img{height:34px;width:auto}
  header span{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  h1{margin-top:28px;font-size:clamp(24px,4vw,42px);line-height:1.15;text-align:center;max-width:900px;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--amber)}
  .player{margin-top:24px;width:100%;max-width:1120px;border-radius:22px;overflow:hidden;background:#000;
    box-shadow:0 30px 80px rgba(20,0,50,.5)}
  .player video{display:block;width:100%;height:auto;background:#000}
  body.mobile .player{max-width:420px}
  .cta{margin-top:28px;display:inline-block;background:var(--amber);color:var(--ink);font-weight:800;font-size:18px;
    text-decoration:none;padding:16px 34px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .cta:hover{filter:brightness(1.05)}
  .contact{margin-top:26px;font-size:15px;color:rgba(255,255,255,.8);text-align:center;line-height:1.6}
  .contact a{color:#fff}
  footer{margin-top:auto;padding-top:32px;font-size:12px;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
  <header><img src="logo.png" alt="joober"><span>Pro firmy</span></header>
  <h1>Nejlepší uchazeči na vaše inzeráty. <em>Hned nahoře.</em></h1>
  <div class="player">
    <video id="v" controls playsinline preload="metadata"></video>
  </div>
  <p class="contact">Tomáš Hyka · Sales manager<br><a href="mailto:tomas@joober.ai">tomas@joober.ai</a> · <a href="tel:+420728104526">+420 728 104 526</a></p>
  <footer>K&amp;P AI s.r.o. · <a href="https://joober.ai" style="color:inherit">joober.ai</a></footer>
<script>
  // na výšku (mobil) pustí verzi 9:16, jinak 16:9
  var portrait = window.matchMedia("(max-aspect-ratio: 4/5)").matches || window.innerWidth < 700;
  var v = document.getElementById("v");
  var k = portrait ? "9x16" : "16x9";
  if (portrait) document.body.classList.add("mobile");
  v.poster = "poster-" + k + ".jpg";
  v.src = "joober-pro-firmy-" + k + ".mp4";
</script>
</body>
</html>
